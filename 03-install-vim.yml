---
- name: Install vim (OS neutral)
  hosts: test
  gather_facts: true
  become: true
  vars:
    vim_package_map:
      Debian: vim
      RedHat: vim-enhanced
    vim_package: "{{ vim_package_map[ansible_facts['os_family']] | default('vim') }}"
  tasks:
    - name: Install vim
      ansible.builtin.package:
        name: "{{ vim_package }}"
        state: present

    - name: Gather package facts
      ansible.builtin.package_facts:

    - name: Show installed vim package
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}:
          {{ vim_package }}
          {{ ansible_facts.packages[vim_package][0].version }}
      when: vim_package in ansible_facts.packages

    - name: Warn if vim is missing
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ vim_package }} NOT installed"
      when: vim_package not in ansible_facts.packages
